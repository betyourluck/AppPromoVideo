DesktopUi:                          # app/ = Tauri 2 + Vue 3 + Pinia。Tailwind は使わず CSS 変数 (data-theme dark/light)
  layout: "3 ペイン: 左 InputPane (リポジトリ / スナップショット / 世界観 / 尺・比率・言語 / 出力先 / 実行・中断) / 中 ScenePanel (要約・シーン表・参照画像・コピー・export。シーンごとの編集は rev16 から CaptionEditor ダイアログ) / 右 LogPanel (event promo-progress)。TitleBar は decorations:false のカスタム (Kataribe 縮約)"
  commands:                         # app/src-tauri/src/lib.rs。HTTP とプロセスは全部 backend
    load_ui_settings / save_ui_settings: "settings.json ミラー (接頭辞 apppromo.)"
    pick_directory / pick_images: "rfd (plugin 不使用、追加権限ゼロ)"
    brief_preview / validate_snapshot: "LLM ゼロ。RepoBrief の字数・行数、画像ヘッダ検証"
    check_cli: "<exe> --version を 20 s で。NotFound を実行前に見せる (P3)"
    run_pipeline / cancel_run: "RunRequest → RunResult{promo, package_dir, analyze, plan, brief_chars}。cancel は watch::Sender (同時 1 run)。cwd = app_data/work (決定 4)"
    generate_images: "ImagesRequest{promo, package_dir, image: ImageGenConfig, snapshot_paths, max_scenes, requested_refs} → ImagesResult{promo, results, palette, anchor, truncated}。user_prefix 空なら style_anchor を合成"
    image_data_url: "表示は data URL (CSP img-src data:)。ローカルファイルを WebView に直接見せない"
    get_image_api_keys / set_image_api_key / probe_image: "キーは app_data/.env、画面には有無 (bool) だけ"
    open_folder / copy_package: "export 補助"
  event: "promo-progress {stage: brief|analyze|plan|cli|cli-stderr|images|done|error, text}"
  typography:                       # rev27 (2026-09-11 ユーザー「文字を少しだけ大きく」)
    tokens: "main.css の :root に --fs-xs / sm / md / base / lg / xl = (11 / 12 / 13 / 14 / 15 / 19 px) × **--fs-scale** (項目、rev29 で 1.25)。**部品は font-size を px で直に書かずトークンを参照する**。例外は Lightbox の矢印 (文字ではなく記号、40px)"
    headings: "rev29: 見出しは --fs-h-md / h-lg / h-xl = (13 / 15 / 19 px) × **--fs-scale-heading** (1.5)。対象 = .panel h2 (入力・結果・進捗) / 結果のアプリ名 .app とキャッチ .hook / メッセージボックス .mb-title / 設定の小見出し .sub の 5 か所 (rev31 で履歴画面の見出し .title を足して 6 か所)。ユーザー「見出しはこれくらい、中の項目はちょっと小さく」で倍率を 2 本に分けた"
    chrome: "rev29: ウィンドウ枠 (タイトルバーのアプリ名 .brand) は文字の試行の対象外。--font-chrome / --fs-chrome / --fw-chrome を参照し、倍率は掛けない。ユーザー「ウィンドウタイトルバーのアプリタイトルのフォントと大きさは変えなくていい」。rev29 の値 (Segoe UI / 12px / 700) は、rev30 のデザイン修正 (ユーザー) で Inter Variable / 14px / 600。中の「実行中」の chip は .chip のまま (項目の倍率が掛かる)"
    font: "rev30: --font-ui = \"Inter Variable\", \"Noto Sans JP Variable\", \"Noto Sans JP\", \"BIZ UDPGothic\", \"Yu Gothic UI\", system-ui …。**同梱する** — @fontsource-variable/inter と @fontsource-variable/noto-sans-jp (5.3.0、OFL-1.1) を main.ts で import。**先頭はパッケージの宣言名** (Inter と書くと手元に入っていない限り当たらない)。**外部 (Google Fonts) から読まない** — tauri.conf.json の CSP は style-src に外部を含まず font-src 未指定 (= default-src 'self')。woff2 を data: にインライン化させない (同じ理由で読めない)。rev28 の IBM Plex Sans JP (未同梱) は rev30 のデザイン修正で置き換わった"
    weight: "rev28: --fw-base (本文) / --fw-semi (旧 600) / --fw-bold (旧 700) を全部 700。本文だけ Bold にすると見出し・ボタンの SemiBold が本文より細く見えて逆転するため。rev29: --fw-medium (500) を追加。rev30 のデザイン修正 (ユーザー): 本文 500 / semi 600 / bold 700 / --fw-regular 400 を追加"
    guard: "rev30: cssTokens.test.ts = フォールバックの無い var(--x) は src のどこかで定義されていること (定義を消すと宣言ごと無効になり黙って親の値に落ちる)。fonts.test.ts = index.html が外部の CSS・フォントを読まない / main.ts が同梱フォントを import / --font-ui と --font-chrome の先頭がパッケージの宣言名。vitest は既定で CSS を空にするので vite.config.ts の test.css.include (ID にクエリ ?raw が付くので /\\.css(?:\\?|$)/) で通す"
    secondary: "rev29: .muted (説明文と補足、47 か所) は Medium (--fw-medium) で小さめ (--fs-sm)。ユーザー「説明文は bold でなく medium で小さめ」。説明文以外の薄い文字 (ログの時刻 / 表の plate_mode 列 / コピー先のラベル / Lightbox の番号など) も同じになる。中の <b> は bolder で Bold に戻る。設定ダイアログの .note も --fs-sm に揃えた"
    log: "rev29: 進捗ログは等幅 (Consolas、Medium が無い) をやめて UI の書体の Medium・本文の大きさ (--fs-base)。時刻の桁は font-variant-numeric: tabular-nums で揃える。ユーザー「進捗のログも medium で普通サイズ」"
    why: "旧値 10 / 11 / 12 / 13 / 14 / 18 px が 37 か所に直書きされていた。基準 (body) だけ上げてもラベルや補足 (11〜12px 固定) が変わらないので、トークンにまとめて全段 +1px。次の調整は main.css の 1 か所で済む"
  form_controls:                    # rev33 (2026-09-12 ユーザー「選択されるとチェックボックスを大きくする必要はないかな」)
    text_inputs: "main.css の input / select / textarea は文字の入力欄の寸法 (幅 100% / 最小の高さ --input-height 44px / 余白) を持つ (rev30 のデザイン修正)"
    checkbox_radio: "input[type=checkbox] / [type=radio] はその寸法を持たない — 16px 四方・余白なし・accent-color は --accent2。部品側で幅や高さを直書きしない (設定ダイアログの style=width:auto は rev33 で外した)"
    switch: "rev34: 入り切りは components/Switch.vue (設定の 4 か所)。中身は checkbox のまま (v-model / Tab の移動 / 読み上げ上の役割を変えない)、枠は input 自身を appearance: none で描き、**つまみは兄弟の span** — <input> の疑似要素はブラウザ次第で、描かれたかを外から確かめられない。枠 38x22 / つまみ 14x14 / 余り 4px、ON は --accent。履歴の比較のチェックは表の複数選択なので checkbox のまま"
  screens:                          # rev36 (2026-09-12 ユーザー「開いているときにもう一度クリックすると戻ると同じ動きに」)
    toggle: "タイトルバーの履歴 / 設定のアイコンは**トグル** (views.ts の nextView)。開いている画面のアイコンをもう一度押すとメインへ戻り、別の画面を開いている時はメインを経由せず切り替える。設定から離れる時は store.persist()"
    active: "開いている画面のアイコンはアクセント色 (.tb-btn.on)。押せば戻ることを見せる"
  result_header:                    # rev36
    source: "結果ペインの見出しの数値は**正本 (promo.json の run_stats)** から出す (runs.ts の runHeaderStats)。履歴から開いた run は実行時の stage を持たないので、そこを描くと存在しない記録 (0 回目で通過 / 0.000 USD) になる"
    no_record: "記録が無い run (rev14 以前) は 0 ではなく「—」で、費用と回数の chip は**出さない**。経過時間の tooltip は stage がある時だけ"
  settings_screen:                  # rev35 (2026-09-12 ユーザー「設定画面もダイアログではなく 1 画面に。スクロールなしで収まるように」)
    shape: "設定 (SettingsScreen.vue) は全画面。タイトルバーの下で 3 ペインと入れ替える (App.vue の view = main | runs | settings)。ダイアログではないので .panel も重なり順も使わない"
    columns: "3 列 = LLM CLI / 画像生成 / 面と見出し。列の間は区切り線。タブは廃止し、見出しに settings.title / cliTab / imageTab を使う (settings.imageTabLabel は撤去)"
    collapsed: "長い説明 (llmNote / toolsNote / imageNote / plateNote / captionNote)、認証の診断、ComfyUI の詳細 (ネガティブ / ワークフロー JSON / seed) は <details> で畳む。**文言は消さない** — 初期表示を 1 画面に収めるため"
    no_scroll: "画面自体はスクロールしない (.screen は overflow: hidden)。収まらない時は**列の中だけ**が動く。実測 1288x842 (ユーザーの窓) と 1600x1017 で画面・3 列とも溢れ 0。ComfyUI の詳細を開いた時だけ 2 列目が 253px スクロールする (JSON の入力欄なので許容)"
    rows: "横に並べる項目は .grid-row (grid + align-items: end) で**下端を揃える** — ラベルが 1〜3 行に折り返すので flex の中央揃えでは入力欄がずれる (ユーザー報告「段が崩れないように」)。label でないボタンは label.field と同じ下余白 4px を自分で持つ。項目の余白は既定 (14px / 6px) より詰めて 8px / 4px"
  i18n:                             # rev30 (2026-09-11、ユーザーが多言語化 → 残りを回収)
    langs: "ja (正本) / en / zh-CN。localStorage apppromo.ui_lang、既定 ja。**コピー言語 (project.lang = LLM に書かせる言語) とは別物**"
    dict: "app/src/i18n.ts。ja の as const からキー型 MessageKey を取り、en / zh-CN は Record<MessageKey, string> — キーの欠け (TS2740) も余り (TS2353) も型検査で落ちる。キー集合の一致は i18n.test.ts でも見る"
    rule: "**画面に出る文言をコードに直書きしない**。網 noHardcodedJapanese.test.ts (コメント以外の日本語を落とす)。対象外 = i18n.ts / settings.ts (見出しフォントの照合に使う実機のフォント名) / console.*。backend (Rust) 由来の進捗ログ・エラー文言はこの契約の外 (日本語のまま)"
    params: "t(key, params) の {name} は 1 回の走査で差し込む。値を置換パターンとして解釈しない ($& がパスやエラー文言に入りうる) / 差し込んだ値の中の {…} を再び拾わない / params に無い名前はそのまま残す"
    rich: "強調と等幅は文言の中に <b>…</b> / <mono>…</mono> と書き、components/Rich.vue で出す (解析は rich.ts)。**v-html は使わない** — 認める印以外の < は文字として出る。閉じ忘れは文末まで、対の無い閉じ印は無視 (文字を落とさない)"
    ja_wording: "rev30 の移行で日本語の文言は変えていない (移行前の日本語断片 275 個を辞書と突き合わせた)。ソースの改行で画面に出ていた空白 1 つも残した"
  panes:                            # rev27 (ユーザー「入力、結果、進捗の枠をなくしてみたい」、試行)
    frameless: "3 つの列の直下の .panel は背景・枠線・角丸を持たない (App.vue の scoped + :deep)。**共通の .panel はダイアログ (シーン編集 / メッセージボックス) が使うので変えない** (履歴は rev31、設定は rev35 から全画面で .panel を使わない)"
  runs_screen:                      # rev31 (2026-09-11 ユーザー「履歴はダイアログではなく全画面に。開くを押すと画面を閉じ、開いた run でメイン画面に戻る」)
    shape: "履歴 (RunsScreen.vue) はダイアログではなく全画面。タイトルバーの下で 3 ペインと入れ替える (App.vue の view = main | runs)。メインは v-show で隠すだけ — 戻った時に入力・コピー先の選択・スクロール位置が残る"
    open: "「開く」は store.openRun(dir): Promise<boolean> が true の時だけメイン画面へ戻る。false ならこの画面に残り、store.error をその場に出す (この画面ではログのペインも入力ペインのエラー表示も見えない)。読み込み中は他の「開く」を押させない。openRun は始めに store.error を空にする"
    back: "左上の「戻る」でメイン画面へ。Esc では戻らない (ダイアログ時代も閉じるボタンと背景クリックだけだった)"
    pin: "rev32: 比較中 (2 つ選択) は比較対象を選んだ順 A → B で表の先頭に出し (runs.ts pinCompared、残りは元の順)、行に A / B の印を付けて下の画像と揃える。組が変わったら画面と表のスクロールを先頭へ戻す。1 つ外すと比較が解けて全件の表に戻る"
    cells: "rev33: 表のセル (td) を display: flex にしない — 表のセルとして並ばなくなり、同じ行で上端と高さがずれる (比較対象の行の色付けが段になった)。並べたい中身は td の中の div を flex にする (チェックと A / B の印 .pick、操作ボタン .row)"
    compare: "rev32: 表の包み (.table-wrap、横にだけ流す) は縮ませない (flex-shrink: 0 — overflow を持つ箱は縦の flex の中で最小の高さが 0 扱いになり、rev31 では画像に場所を譲って 2 行まで潰れた)。比較中だけ表に max-height 30vh + 中でスクロール + 見出し行を固定。比較の区画が残りの高さを取り、画像はその中に object-fit: contain で収まる。画像の枠の最小 260px、それより低い窓は画面全体をスクロール"
  dialogs:                          # rev26 (2026-09-11 ユーザー報告、スクリーンショットつき)
    rule: "**ブラウザ標準の confirm / alert / prompt を使わない**。WebView の標準ダイアログは見出しに配信元の URL (`localhost:1421 の内容`) を出し、見た目もアプリから外れる"
    where: "`dialog.ts` の `ask(opts) -> Promise<boolean>` が状態を持ち、`MessageBox.vue` (App.vue に 1 つ) が描く。**一度に 1 件** — 出ている間の次の ask は待たせ、答えた順に返す"
    options: "message / title (既定「確認」) / ok (既定「OK」) / cancel (既定「キャンセル」) / danger (削除など。肯定側を警告色にし、最初の焦点を否定側へ)"
    keys: "Esc と背景クリック = 否定側。keydown は capture 段階で受けて伝播を止める (下のダイアログの Esc が同じ打鍵で反応しないように)。Tab は 2 つのボタンの間に閉じ込める。閉じたら開く前の焦点へ戻す"
    layer: "z-index 70 = すべてのダイアログの上 (シーン編集 45 / トースト 50 / Lightbox 60)。履歴 (rev31) と設定 (rev35) は全画面なので重ならない (40 は空き)"
    guard: "`noBrowserDialogs.test.ts` が src の .vue / .ts を走査して標準ダイアログの呼び出しを落とす (機械の網)。網そのものの検出力もテストする (画面の文言「video prompt (…)」に初版が誤検出した)"
  snapshots_ux:                     # 2026-09-08 ユーザー FB: ドロップ / 貼り付け / 横並び + 拡大
    drop: "tauri.conf dragDropEnabled: true → getCurrentWebview().onDragDropEvent の drop.paths (OS のパスが取れる。HTML5 drop はパスを持たないので使わない)。enter/over で帯を強調"
    paste: "window の paste event → clipboardData.items の image/* File → FileReader.readAsDataURL → base64 を command save_clipboard_image(base64, mime) へ → app_data/snapshots/clip_<ms>.<ext> に保存し snapshot_meta で検証 (壊れていれば消す) → 他のスナップショットと同じパスとして一覧へ"
    strip: "SnapshotStrip.vue: 横スクロールのサムネイル (data URL)、× で外す、クリックで Lightbox (← → Esc、『この画像を外す』)。参照画像も同じ Lightbox で拡大"
    pure: "snapshots.ts (mergePaths 重複と非画像の除外 / stripDataUrl / imageFilesFrom / baseName) は vitest 3 本"
  settings_two_sections: "決定 10 の実装。設定は『LLM CLI』(キー欄なし、CLI 認証委任の説明) と『画像生成』(OpenAI/Gemini はキー必須・ComfyUI は無キー) を**別の列**に置く (rev34 まではタブ)"
  frontend_settings: "localStorage apppromo.cli / apppromo.image (perProvider スロット = Kataribe spec 26 の写し、toBackendConfig で他プロバイダの値を送らない) / apppromo.project / apppromo.theme。vitest 6 本"
  clipboard: "navigator.clipboard.writeText (plugin 不使用)。CopyTarget veo|sora|generic は ScenePanel で選ぶ"
  send_bounds: "Tauri の async command は future 全体に Send を要求 → TaskRunner / ImageGenerator trait を Send + Sync、progress を dyn FnMut + Send、tree_kill unix の Cell を Mutex に (Phase D で判明)"
  verification: "vue-tsc + vite build green / vitest 6 / src-tauri cargo check・clippy clean・test 3 / GUI の目視はユーザー"

