# data_contract.yaml — AppPromoVideo の名詞台帳 (コードより先に凍結する)
#
# 規律: ここに無い名詞はコードに現れない。フィールドを撤去したら、その名前で
# CLAUDE.md / specs/*.md / doc comment を grep して追従漏れを回収してから完了とする。
# `history.md` は追記専用の記録なので回収の対象外 (過去のエントリはその時点の事実として残す)。
# 移植元: Kataribe (D:/Github/Kataribe) の image_gen.rs / specs 24-27。移植した契約には (Kataribe) と記す。

meta:
  project: AppPromoVideo
  frozen: 2026-09-07
  rev: "rev2 (2026-09-07 ユーザー査読 11 点を反映。specs/01 の『査読の反映』節が対応表)"
  gui: "Tauri 2 + Vue 3 (2026-09-07 ユーザー決定。構想文の Flutter + flutter_rust_bridge は不採用 — Kataribe の image_gen / 設定 UI がそのまま移植でき、この機体に Flutter が無い)"
  rust: "edition 2024 / rust-version 1.85 (構想文の Edition 2024 / 1.78 は矛盾。2024 edition は 1.85+)"
  scope_out:
    - "動画ファイルのレンダリング・動画生成サービス (Veo / Sora / Runway) との直接連携。成果物は動画生成用プロンプトと参照画像のみ"
    - "LLM の HTTP API 直接呼び出し (禁止。ローカル CLI のサブプロセスのみ)。画像生成の HTTP (OpenAI Images / Gemini / ComfyUI) は許可 — LLM ではない"

# ---------------------------------------------------------------------------
# 入力
# ---------------------------------------------------------------------------
PromoProject:                       # 1 案件 = 1 リポジトリ。GUI の入力ペインと export の manifest が同じ形を持つ
  project_path: PathBuf             # 解析対象リポジトリの root (存在必須・ディレクトリ必須)
  snapshot_paths: Vec<PathBuf>      # UI スナップショット。png/jpg/jpeg/webp のみ (拡張子は大文字小文字を区別しない)。0 枚可
  video_concept: String             # 動画イメージ / 世界観の指示 (ユーザー編集のシステムプロンプト素材)
  language: "ja | en"               # コピー・ナレーションの言語。video_prompt は常に英語 (動画生成モデル向け)
  cli: CliSpec
  image: ImageGenConfig             # (Kataribe) 非秘密のみ。API キーは app_data/.env
  export_dir: PathBuf

# ---------------------------------------------------------------------------
# LLM CLI (サブプロセス)
# ---------------------------------------------------------------------------
CliSpec:
  kind: "claude | aider | custom"
  executable: String                # 絶対パス or PATH 上の名前。起動前に存在検査 (which 同等) — 無ければ CliError::NotFound
  extra_args: Vec<String>           # ユーザー追加引数 (例 --dangerously-skip-permissions)。kind 既定引数の後ろに付く
  timeout_secs: u64                 # 既定 600。最小 30 (それ未満は 30 に切り上げ)
  model: Option<String>             # claude: --model へ。aider: --model へ。custom: 無視

CliInvocation:                      # build_invocation の戻り。純粋 (プロセスを起動しない) — PoC で固定
  program: String
  args: Vec<String>
  prompt: String                    # 指示本文 (RepoBrief.render() + 指示)。全 kind で引数に載せない (OS の引数長制限とログ漏れ。rev2 査読 1 で aider の例外を撤去)
  transport: "stdin | message_file" # stdin = claude / custom。message_file = aider (runner が一時ファイルに書き `--message-file <path>` を argv 末尾に足す。aider 公式 -f)
  cwd: PathBuf                      # app 所有の作業ディレクトリ (app_data/work)。**project_path にしない** — `-p` は cwd の .claude/settings.json の hook と .mcp.json を信頼ダイアログなしで実行する (公式 headless 文書)。解析対象は他人のリポジトリになり得る
  structured: "json_schema | fenced_json | none"
  kind: CliKind                     # runner が畳み方 (claude = stream-json / 他 = 生 stdout) を選ぶために持つ
  env_scrub:                        # 2026-09-08 GUI 実測 (failures #7) 起点。cli_runner::env_scrub
    always_removed: "CLAUDE_CODE_* / CLAUDE_PREVIEW_* / CLAUDECODE / CLAUDE_PID / CLAUDE_EFFORT / CLAUDE_AGENT_SDK_VERSION — Claude Code がホストとして子に注入する変数。本アプリの子 CLI は独立プロセスなので渡さない (ホストのメッセージングソケットに認証更新を頼む経路を断つ)。ANTHROPIC_* は残す"
    oauth_only: "CliSpec.oauth_only (GUI 設定『OAuth ログインを使う』) が true なら ANTHROPIC_API_KEY / ANTHROPIC_AUTH_TOKEN も外し、claude auth login の OAuth を使わせる。端末の鍵が古い・無効なときの回避 (RunOptions.env_remove)"
    diagnostics: "check_cli が AuthView {api_key_present, api_key_len, api_key_fingerprint (FNV 12 桁、値は出さない), auth_token_present, base_url, oauth_logged_in, oauth_method, scrubbed[]} を返し、設定 → LLM タブに表示。run 開始時にも同じ 1 行を進捗ログへ"
    poc: "tests/runner.rs host_coupling_env_is_scrubbed_but_user_config_passes (fake_cli env モード: CLAUDE_CODE_MESSAGING_SOCKET / CLAUDECODE が absent、ANTHROPIC_* 相当が present、env_remove 指定で absent)"
  invariants:                       # 純関数のテストで固定 (rev2 査読 3)
    - "allowedTools に Read が入る時は必ず --add-dir <project_path> が付く"
    - "cwd != project_path (全 kind)"
    - "本文は argv に現れない (全 kind × schema 有無)"
    - "--dangerously-skip-permissions / --bare は既定で付けない (--bare は OAuth を使わず ANTHROPIC_API_KEY が要る = 『LLM のキー管理不要』と衝突。ユーザーが extra_args に書いた時だけ)"
  # kind 別の既定引数 (凍結):
  #   claude : -p --output-format stream-json --verbose --max-turns N [--model M]
  #            [--json-schema <schema>] (構造化タスクのみ) --add-dir <project_path>
  #            --allowedTools Read Glob Grep (リポジトリ走査は CLI に委任 — 2026-09-07 ユーザー決定。Write/Edit/Bash は許可しない)
  #   aider  : --no-git --yes-always --no-auto-commits [--model M] + (runner が) --message-file <tmp>。`--yes` は存在しない (公式は --yes-always)。未導入のため実機未確認
  #   custom : 既定引数なし。stdin に本文
  # 構造化出力: claude = json_schema (result.structured_output — 公式文書で確認済み、stream-json での実データは fixture 採取待ち) + fenced_json フォールバック / aider・custom = fenced_json
  # fenced_json の規則 (rev2 査読 4): ①最後の ```json フェンスの中身 ②無ければ括弧バランスの取れた最上位 {…} の最後のもの (文字列内の括弧は数えない)
  #   ③「最初の { から最後の }」は採らない (2 オブジェクトを跨いで拾う — Red で再現済み)。Kataribe failures #29 の no-tools と同型
  # 走査の深さの差 (rev2 査読 3): RepoBrief は全 kind で同一バイト列 = 最低保証。claude の Read/Glob/Grep による深掘りは**上乗せ**であって別経路ではない。aider は --read <file> で追加ファイルを渡す口を持つが v1 では使わない (RepoBrief が本文に入っている)
  # 隔離 (rev2): cwd を app_data/work にすることで対象リポジトリの hook / MCP / CLAUDE.md を拾わない。Read の到達範囲は cwd + --add-dir (Claude Code の permission 境界)。この境界の実効性は Phase B live で「--add-dir 外の既知ファイルを読ませて拒否されるか」で確認する

CliEvent:                           # 実行中に Rust から GUI へ push するストリーム (Tauri event "cli-progress")。runner::run の on_event
  Started { pid: u32 }
  Stdout { text: String }           # 人が読む断片。claude なら assistant text、他は生の行
  Stderr { text: String }
  Progress { text: String }         # 結果に影響しない進捗 (api_retry の retry_notice 等)
  Structured { json: Value }        # 構造化出力が取れたとき 1 回
  # Finished は runner::run の戻り値 (Result<RunOk, RunFailed>) で表し、Tauri 層が event に写す

runner:                             # Phase A (2026-09-08 実装・PoC 9 本 + 判定検算 1 本)
  api: "runner::run(&CliInvocation, RunOptions{timeout, cancel: watch::Receiver<bool>}, on_event) -> Result<RunOk, RunFailed>"
  transport: "Stdin = 本文を書き切って shutdown (EOF を届ける) / MessageFile = cwd に prompt_<pid>_<nanos>.txt を書き `--message-file <path>` を argv 末尾に足し、終了後に削除 (Drop)"
  streams: "stdout / stderr を行単位で select! 読み。stderr は末尾 4 KB を保持 (RunFailed.stderr_tail)。claude は parse_line で Text → Stdout / ApiRetry → Progress、他 kind は生行 → Stdout"
  stop: "timeout / cancel / early_abort (終端 assistant.error) の 3 経路すべて tree_kill で木ごと止めてから wait"
  fold: "claude = stream::fold_lines (structured は result.structured_output → 無ければ result 文字列の fenced) / aider・custom = 終了コード検査 → 生 stdout 連結 → fenced_json なら救済"
  not_found: "spawn の io::ErrorKind::NotFound を CliError::NotFound へ (事前の PATH 検索はしない — spawn が唯一の真実)"

CliOutcome:
  Ok { text: String, structured: Option<Value>, cost_usd: Option<f64>, duration_ms: u64, model: Option<String> }   # model = init 行の実名 (rev25)。aider / custom は None
  Failed { error: CliError, stderr_tail: String }

CliError:                           # 契約 errors。UI はこの列挙で文言を出す (沈黙させない)
  NotFound { executable: String }   # spawn 前の存在検査 or ENOENT
  Timeout { secs: u64 }             # kill 済み
  Cancelled                         # ユーザー中断 (kill 済み)
  kill_semantics:                   # rev2 査読 8: tokio の child.kill() は Windows で TerminateProcess = 子孫が孤児化する。実装 = tree_kill.rs
    windows: "Job Object (CreateJobObjectW + KILL_ON_JOB_CLOSE、spawn 直後に AssignProcessToJobObject、止める時は TerminateJobObject)。**2026-09-08 実機 Green** (孫 = fake_cli hang 120 が timeout 後に消える)。限界: spawn〜アタッチの数 µs に生まれた孫は Job 外 (tokio は CREATE_SUSPENDED を出さない)"
    unix: "process_group(0) で spawn → killpg(SIGTERM) (claude は SIGTERM で実行中 Bash のプロセス木を止めて exit 143 する — 公式) → 猶予 5s → killpg(SIGKILL)。**この機体 (Windows) では未コンパイル・未検証**"
    poc: "tests/runner.rs timeout_kills_the_whole_tree_including_grandchild (fake_cli grandchild が孫 pid を stdout に出す → timeout 2s → process_alive(pid) == false)。process_alive 自体は自分=true / 終了済み=false で検算 (常に false の実装で通ってしまうのを防ぐ)"
  ExitStatus { code: Option<i32>, stderr_tail: String }
  Auth { message: String }          # claude stream-json: assistant.error == "authentication_failed" or result.is_error + 本文 (fixtures/claude_auth_failed.jsonl = 2026-09-07 実測)
  Shape { detail: String, raw: String }   # stream-json / JSON が読めない。raw 保持 (再生成の燃料)

ClaudeStreamLine:                   # claude -p --output-format stream-json の 1 行 (NDJSON)。既知の type だけ読み、未知は Stdout へ流す (捨てない)
  system: { subtype: "init | api_retry | hook_started | hook_response | ...", session_id, model }   # model (init のみ) = **解決後の**実名。`--model sonnet` でも空欄でもここは実名 (rev25、fixture で確認)
  api_retry: { attempt, max_retries, retry_delay_ms, error_status: Option<u16>, error: "authentication_failed | oauth_org_not_allowed | billing_error | rate_limit | overloaded | invalid_request | model_not_found | server_error | max_output_tokens | unknown" }
  # 2026-09-08 実測 (fixtures/claude_auth_retry_loop.jsonl、ユーザー端末): 401 は attempt 1..10 (遅延 0.5s→38s、合計約 2.5 分) を回してから assistant(error) + result(is_error) に落ちる
  early_abort: "runner は行を読むたびに stream::early_abort を評価するが、**api_retry では止めない**。初案『authentication_failed の初回再試行で打ち切る』は同日の成功 fixture (401 × 7 回の再試行の後に成功) で反証された。止めるのは終端の assistant.error (authentication_failed) だけ。再試行は stream::retry_notice で『再試行 n/max (種別, HTTP) — 待ち秒』として進捗ログに出し、待つか中断するかはユーザーが決める"
  assistant: { message: { content: [ {type: text, text} | ... ], model }, error: Option<String>, is_api_error_message: Option<bool> }
  result: { is_error: bool, result: String, total_cost_usd: f64, duration_ms: u64, num_turns, terminal_reason: "..." }
  # --json-schema 使用時の構造化出力は **result.structured_output で確定** (2026-09-08 実測 fixtures/claude_json_schema_ok.jsonl)。`result` 文字列にも同じ JSON が入る。機序: assistant が `StructuredOutput` という tool_use を出し、user 行に tool_result が返り、result 行に載る。--allowedTools に StructuredOutput を書かなくても動いた。無ければ result 本文の fenced_json へ落ちる
  other_types: "user (tool_result の往復) / rate_limit_event / stream_event (--include-partial-messages 時) は未知 type として Other で素通し (捨てない)。成功 run にも api_retry が混じる (同 fixture: 401 authentication_failed × 7 の後に成功。OAuth 期限切れ + ANTHROPIC_API_KEY ありの環境)"
  fixture_procedure: "ユーザーの通常端末で `pwsh scripts/capture_claude_fixture.ps1` → scripts/redact_stream.py が cwd/tools/hook 行を伏せて crates/cli_runner/fixtures/claude_json_schema_ok.jsonl に書く → stream::tests に include_str! で焼く。Neo のセッション内では OAuth が継承されず採取不可 (live.claude_stream_20260907)"

# ---------------------------------------------------------------------------
# パイプライン (LLM が書く物。schemars で JSON Schema を機械生成し --json-schema に渡す = 規格と実装の単一真実源)
# ---------------------------------------------------------------------------
RepoBrief:                          # Rust が本文に載せる圧縮マニフェスト (CLI の深掘りの起点。走査本体は CLI が Read/Glob/Grep で行う)
  purity: "promo_core::brief = 刈り込みと整形だけ (純粋、BriefInputs -> RepoBrief -> render())。FS を読む収集は crates/pipeline (Phase B)。rev2 査読 6"
  root_name: String
  tree: String                      # 深さ 3。1 行 100 字超は … で切る。収集規則は tree_source を見よ
  tree_truncated: bool
  tree_source:                      # rev4 (Phase E)。Kataribe / Fuseforks の 2 本は生成物を tree に持たない綺麗な例で、
                                    # 別リポジトリに当てた瞬間に tree が生成物で埋まった (2026-09-08 実測)。
    primary: "git ls-files (対象が git リポジトリの時)。深さ 3 以下に絞り、親ディレクトリ行を補う"
    fallback: "git が無い / 失敗した時のみ従来の FS walk。除外語と拡張子はこちらにだけ効く"
    excluded_dirs: [".git", "node_modules", "target", "dist", "build", ".venv", "venv", "__pycache__", ".idea"]
    excluded_ext: ["lock"]
    secret_names: "*.env / .env* / *key*.txt / *.pem / *.p12 / *secret* / *_key / *credential* は名前ごと落とす (全経路)"
    machine_named_elision: "子の 50% 以上かつ 5 件以上が機械生成名 ([0-9a-f]{16,} または UUID 断片) のディレクトリは 1 行に畳む: `<dir>/ (N entries, elided)`"
    measured_20260908: |
      深さ 3 以下の行数 (FS walk -> git ls-files):
        mxf-tool 314 -> 39 (doxy/html 227 行が gitignore 済み) / CaptionConverterSakura 400(切り捨て) -> 101 (vcpkg 251 行)
        Verificator 114 -> 22 (venv/Scripts。除外語は .venv しか知らず venv を取りこぼしていた)
        outcast 280 -> 231 (backend/.sqlx 49 は追跡されているので git では消えない -> machine_named_elision が畳む)
        Kataribe 188 / Fuseforks 141 は元からノイズ 0 = 契約を凍結した時の標本が偏っていた
      件数による畳み込みは棄却: Fuseforks specs/ 52 (最重要) と outcast .sqlx/ 49 (純ノイズ) は 3 件差で分離不能。
      機械生成名は 7 リポジトリで完全分離した (.sqlx 49/49、他の全ディレクトリ 0)。
  readme: Option<String>            # README*.md 先頭
  readme_truncated: bool
  manifests: Vec<{ path, head, truncated }>   # Cargo.toml / package.json / pyproject.toml / pubspec.yaml / go.mod / *.csproj の順
  snapshots: Vec<{ path, width, height }>     # 画像メタ (image crate)。バイトは送らない (v1: CLI は画像を見ない)
  limits:                           # 全 kind 共通 = 最低保証サイズ (rev2 査読 3)。テストで固定
    tree_max_lines: 400
    tree_line_max_chars: 100
    readme_max_chars: 8000
    manifest_max_files: 5
    manifest_max_chars: 2000
    render_max_chars: 64000         # 最悪 ≈ 59.5k 字。UTF-8 で最大 192 KB、claude の stdin 上限 10 MB の 2 桁下
    note: "初案 (総量 32 KB) は部分の和 (最悪 36 KB+) より小さく最悪ケースの PoC で落ちた (2026-09-07 Red)。上限は同じ単位 (文字数) で揃え、tree の 1 行にも上限を置いた"

AnalyzedSummary:                    # タスク 1 の出力 (schemars 派生)
  app_name: String
  one_liner: String                 # 30 字以内
  core_value: String
  target_audience: String
  differentiators: Vec<String>      # 3〜5
  hook_copy: String                 # キャッチコピー 1 本
  visual_identity: VisualIdentity   # スナップショットの記述 (CLI は画像を見ないので v1 は README/テーマ設定からの推定 + ユーザー編集)

VisualIdentity:                     # スタイルアンカー (画像プロンプトの接頭辞素材)
  palette: Vec<String>              # hex 3〜5。**既定はスナップショットの画素から Rust が算出** (image crate、k-means/ヒストグラム。LLM 不要・純関数) → ユーザー編集。LLM の推定は使わない (rev2 査読 11: README にテーマ色は書かれていない)
  mood: String                      # 例 "calm, minimal, warm light" (LLM 推定 + ユーザー編集)
  ui_traits: Vec<String>            # 例 "dark sidebar", "rounded cards" (LLM 推定 + ユーザー編集)
  ui: "設定ペインで palette は必須欄 (3 色以上)。スナップショット 0 枚なら手入力必須。自動算出は Phase C"

ScenePlan:                          # タスク 2 の出力 (schemars 派生)
  total_seconds: u32                # 15 / 30 / 60 のいずれか (UI 選択)
  aspect: "16:9 | 9:16 | 1:1"
  scenes: Vec<Scene>                # 3〜8

Scene:                              # rev3 (2026-09-08、ユーザー FB「スクショに全く従わない」+ 参考: 画像ファースト → i2v): 画像が主役、動画は画像を動かすだけ
  cut_kind: "product | mood"        # product = 実スクショの画素を Rust が合成 (モデルは背景だけ描く) / mood = 情景 (モデルが全部描く)。スナップショットがあるなら product が 1 つ以上必須 (validate)
  snapshot_index: Option<u32>       # product が使うスナップショット (0 始まり、scene_prompt が一覧を示す)。範囲外は違反
  motion_prompt: String             # 英語 1〜2 文。image-to-video 用に**動きとカメラだけ** (絵の内容は画像が持つ)。空・非英語は違反
  scene_id: u32                     # 1 始まり連番
  duration_seconds: u32             # 3〜10
  shot_type: String                 # Close-up / Medium / Wide / Screen recording 等 (自由文)
  video_prompt: String              # 英語。動画生成モデル向け。`--ar` を含まない (Midjourney 記法。Veo/Sora の文法ではない — rev2 査読 5)。aspect は ScenePlan が持つ
  copy_text: String                 # テロップ / ナレーション (language)
  image_prompt: String              # 静止画 1 枚のプロンプト。**product では背景のみ** (画面・端末・UI・文字の語は validate が弾く = 合成と二重にしない)。mood では絵の全部。参照そのものを指す語 (reference / screenshot / sheet) は書かない (Kataribe failures #85)
  video_prompt: String              # text-to-video の**保険** (rev3 で主役から降格)。Veo / Sora は指示に従わないのでコピー先から外した (ユーザー実測 2026-09-08)
  plate_tilt: Option<{ yaw_degrees: f32, pitch_degrees: f32 }>   # rev5。product のみ。背景のパースに合わせてスクショ面を傾ける指定。
                                    # yaw 負 = 左が奥 / 正 = 右が奥。pitch 負 = 上が奥 (俯瞰) / 正 = 下が奥 (ローアングル)。
                                    # 各 -35〜35 度。範囲外は違反 (PlateTiltOutOfRange)。省略 = 正面。frontal モードでは無視される
  reference_image: Option<PathBuf>  # 生成後に埋まる

PlateMode:                          # rev5 (2026-09-08 Phase E 実測: 背景のパースと貼った面のパースが噛み合わない)。設定で切り替え、**既定 = frontal** (rev22)
  perspective: "scene.plate_tilt に従い、スクショ面を射影変換で傾けてから合成する。背景のアングルと整合する。tilt が 0 / 省略なら frontal と同じ経路 (画素等価)"
  frontal: "**既定** (rev22)。正面固定。plate_tilt を無視し、さらに image_prompt のアングル語 (low angle / top-down / tilted / three-quarter / isometric / overhead 等) を検査で弾いて背景も正対に保つ。絵の変化は乏しくなるが不整合は原理的に出ない"
  note: |
    Phase E (AppPromoVideo 自身、2026-09-08) で表面化。scene 3 の image_prompt が `photographed at a low angle` で
    背景も実際にローアングルなのに、貼られた UI は正対のままだった。product カットが 1 種類しか無かった
    Fuseforks の 1 本では見えず、複数の product カットを別アングルで作った瞬間に出る。
    検査はモードに依存する = validate_scene_plan は PlateMode を受け取る。
  default_frontal: |
    **既定を frontal にした根拠** (rev22、2026-09-09 ユーザー観測、rev5 から開いていた判断の決着):
    MiniMax の image-to-video に通したところ、**傾けると動きが過剰になった**。静止画としての整合
    (背景のパースと面のパースが合う) と、そこから起こした動画の落ち着きは別の話で、後者が製品の目的。
    perspective は残す — 捨てる根拠は無く、設定と `--plate perspective` で選べる。
    **既存の run は影響を受けない** (rev10 で promo.json 自身が plate_mode を持つ)。
    **保存済みの設定も上書きしない** — localStorage に perspective がある人はそのまま。
    既定の変更が効くのは新規の環境・CLI・plateMode を持たない保存 (rev8 の precedent と同じ扱い)。

# ---------------------------------------------------------------------------
# 画像生成 (Kataribe image_gen.rs を移植。差分は本節に記す)
# ---------------------------------------------------------------------------
ImageGenConfig:                     # (Kataribe) provider / base_url / model / shape / detail / style / user_prefix / negative / workflow_json / timeout_secs / lock_seed / seed
  provider: "openai | gemini | comfy"
  shape: "square | landscape | portrait"   # 既定は ScenePlan.aspect から写す (16:9 は landscape)
  detail: "standard | high | highest"
  port_plan: "Kataribe の image_gen.rs は Tauri 非依存 (use は std / serde / serde_json のみ、tauri 語 0 件。#[tauri::command] は lib.rs 側) — 2026-09-07 grep 実測。ファイル単位で crates/image_gen/src/provider.rs へ写し、同梱の PoC (#[test] 10 + live 5 = ignored) を**そのまま**持ち込んで green を確認した (2026-09-08) = encode/decode 純関数の入出力同型の証明。**provider.rs は以後も触らない** (Kataribe との diff を追える状態を保つ)。契約差分は generator.rs (trait + ComfyUI の自前待機ループ) / refs.rs / comfy_wait.rs / palette.rs に載せた。provider.rs の image_file_name は未使用 (保存名は promo_core::reference_image_name)。Tauri command は app 側で新規に書く"
  modules:
    generator: "ImageGenerator trait { generate(cfg, api_key, prompt, seed, refs, progress) / probe }。HttpImageGenerator = OpenAI/Gemini は provider::generate に委譲、ComfyUI だけ /queue 併読の自前ループ。compose_reference_prompt(prefix, image_prompt, has_refs) = アンカー + 本文 (+ 参照ありなら SINGLE_FRAME_CLAUSE)"
    palette: "dominant_colors(pixels, n): 4 bit/ch 量子化 → ヒストグラム → 頻度順に RGB 距離 60 未満を統合 → hex。palette_from_file は Nearest で 96px に縮小 (thumbnail の triangle 補間は 2 色画像から第 3 の混色を生んだ — PoC で判明)"
    style_anchor: "promo_core::style::style_anchor(VisualIdentity) = 『Color palette: #…, #…. Mood: …. UI style: …; …』。palette は extract_hex で #RRGGBB だけ拾う (LLM が説明を混ぜる実例あり)。apply_palette は測った色が空でなければ LLM の値を置き換える"
    reference: "pipeline::reference::generate_references(generator, RefJob{cfg, api_key, out_dir, palette, ...}, plan, refs, progress) → Vec<SceneImage>。シーン単位で失敗を返し他を続ける。保存名 scene_NN_ref_01.png、plan.scenes[i].reference_image を埋める。**product** = 参照を送らず背景だけ生成 (プロンプト末尾に BACKDROP_CLAUSE『no devices, no screens…』) → composite_product_cut で実スクショ (snapshot_index) を合成。背景生成が失敗したら palette 先頭色の単色背景で合成 (製品カットは provider の都合で落ちない)。**mood** = 従来どおり参照を送って生成"
    compose: "image_gen::compose::composite_product_cut(background, screenshot, Layout{width, height, screen_ratio 0.78, corner_radius, shadow, tilt}) → PNG。背景は cover、スクショは等比縮小 (拡大しない)・角丸・落ち影 (blur 10)・中央。**tilt が非ゼロなら射影変換で傾けてから貼る** (rev5): 面を 3D で yaw/pitch 回転 → ピンホール投影 → 4 点から homography を解いて逆写像 + バイリニア。tilt = 0 は従来の overlay 経路をそのまま通る (画素等価を PoC で固定)。canvas は **スクショを縮小せずに置ける大きさ** (rev6): canvas_for_snapshot(SizeMap::comfy_dims(shape), 最大のスクショ, screen_ratio, CANVAS_MAX_LONG_EDGE=3840) — 比率を保ったまま拡げ、長辺 3840px で頭打ち。実測 1282×842 の窓 → 1344×768 から 1890×1080 へ。上限に当たって縮小が残る時は進捗に警告 (黙って劣化させない)。fit_to_canvas で mood カットも同寸・PNG に揃える (プロバイダ出力は Gemini が JPEG 1376×768 で、product と食い違っていた)。PoC 10 本 (中央画素がスクショと一致 / 角丸 / 等倍維持 / 壊れ入力は Err / 傾き 0 は従来経路と画素等価 / yaw 正で右辺が縮む / pitch 負で上辺が縮む / 傾けても影が残る / canvas が窓に合わせて拡がる / fit_to_canvas が寸法と形式を揃える)。日本語見出しの焼き込みは v1 外 (フォント同梱が要る)。目視 1 枚: Gemini 背景 + Kataribe UI (failures #8)"
  differences_from_kataribe:
    - "参照画像 = UI スナップショット。送信順はユーザーの並び順"
    - "user_prefix の既定 = VisualIdentity から合成したスタイルアンカー (ユーザー編集可)"
    - "保存名 = scene_{NN}_ref_{MM}.png (export_dir 直下、MM = 同一シーン内の生成通番。rev2 査読 9: 1 シーン複数枚で衝突しない)。Kataribe の {stamp}_{slug}_T{turn} は採らない"
  reference_limits:                 # rev2 査読 9。上限 (provider::max_refs = Kataribe の凍結値) と既定送信枚数は別の列。実装 = image_gen::refs::select_refs
    openai: { api_max: 3, kataribe_live: 1, default_send: 1, note: "Kataribe の max_refs は 3。OpenAI 公式の『image[] 最大 16』は本 workspace で未検証なので採らない (rev2 の 16 は誤り — 2026-09-08 移植時のテストで判明)。2 枚以上は Phase C live まで既定にしない" }
    gemini: { api_max: 3, kataribe_live: 1, default_send: 3, note: "gemini-2.5-flash-image の公式上限 3。inlineData を前置" }
    comfy:  { api_max: 3, kataribe_live: 1, default_send: 3, note: "%ref_1..3%。ワークフローに差し込み口が無ければ沈黙する (Kataribe #83) → 設定タブで %ref_1% 不在を警告" }
    rule: "送る枚数 = min(ユーザー選択 or default_send, api_max, 手持ち枚数)。先頭から (ユーザーの並び順)。切り詰めたら Truncated{total, sent, limit_by} を UI に『N 枚のうち先頭 M 枚』と出す (沈黙させない)"
  caption:                          # 見出し (copy_text) の焼き込み。**既定 ON** (rev8、2026-09-08 ユーザー判断で OFF → ON)
    spec: "CaptionSpec { font_path, font_index, size_ratio 0.055, position top|bottom, color '#RRGGBB' (rev9、省略で白), y_ratio (rev14) }"
    to_caption: |
      **`CaptionSpec::to_caption` が `Caption` を組み立てる唯一の場所** (rev17)。生成も焼き直しもここを通る。
      rev14 で `y_ratio` を足したとき、同じ組み立てが 2 箇所にあり焼き直し側だけ落ちていた
      (縦位置スライダーが promo.json には残るのに絵が動かない、failures #18)。フィールドを足すならここだけ直す。
    effective_position: |
      **面が避ける側は `y_ratio` から導く** (rev18)。上半分 (< 0.5) なら Top、下半分なら Bottom、
      `y_ratio` が無ければ設定の `position`。UI から「位置」の選択を外した (縦位置スライダーが上位互換、
      ユーザー判断 2026-09-09) ので、これが無いと見出しを上へ動かしても面が下の帯を避け続ける。
    per_scene:                      # rev9 (2026-09-08 ユーザー要望「1 枚ごとに位置を決めたい」)
      why: |
        見出しは**生成時に焼き込まれ、完成品の 1 枚しか残らなかった**。焼く行為そのものはアプリ内で無料だが、
        **焼く対象を作り直せなかった** — 背景 (`generator.generate` の戻り値) はローカル変数で、
        一度も書き出していなかったため。スクショは `snapshots/` にあるので、材料の半分だけが残っていた。
      rev10_correction: |
        rev9 は「焼く前の**合成画像**」を base/ に置いたが、それでは足りなかった。合成の時点で
        `with_caption_band` が**帯の位置を焼き込む** (プレートを 0.78→0.68 に縮め、見出しと反対側へ 7.5% ずらす)。
        つまり位置を下→上に変えると、上に空きが無いところへ焼くことになりプレートに重なる。
        **base/ に置くのは背景**にする。スクショは `snapshots/` にあるので、アプリ内で**合成からやり直せる** —
        帯も正しく取り直せ、`plate_tilt` も無料で変えられる。ディスクは同じ (どちらも canvas 同寸)。
      overrides: "PromoJson.caption_overrides: Map<scene_id, CaptionOverride>。**LLM のスキーマ (Scene) には足さない** — 埋めるのは人であって LLM ではない"
      resolution: "scene の上書き → 無ければ設定 (既定) → それも無ければ焼かない。フィールド単位で落ちる (位置だけ上書き、他は既定 が成り立つ)"
      reburn: |
        command reburn_caption(run_dir, scene_id, spec) — **生成 API は呼ばない**。
        product: base/ の背景 + snapshots/ の写し → `layout_for(canvas, 効いている position, tilt)` で合成 → 焼く。
        mood: base/ をそのまま → 焼く。どちらも直下の完成品を置き換え、promo.json の overrides を更新して data URL を返す。
        毎回 base から作り直すので、何度やっても劣化しない。
      layout_for: "canvas / 見出しの有無と位置 / 傾き / はめ込みの上書き から Layout を作る**唯一の関数**。生成と焼き直しで共有する (帯の計算が二重にならないように)"

PlateOverride:                      # rev11 (2026-09-09 ユーザー要望「傾きもはめ込み位置も変えたい」)。product カットのみ
  why: "rev10 で合成からやり直せるようになったので、見出しだけでなく**プレートの置き方**も無料で変えられる。より複雑な PR 動画を作るには 1 枚ごとの調整が要る"
  where: "PromoJson.plate_overrides: Map<scene_id, PlateOverride>。caption_overrides と同じく**LLM の schema には足さない**"
  yaw_degrees: Option<f32>          # ±35。省略で scene.plate_tilt (LLM が書いた値)
  pitch_degrees: Option<f32>        # ±35。同上
  screen_ratio: Option<f32>         # 0.2〜0.95。プレートが canvas に占める最大比。省略で 0.78 (見出しありは 0.68)
  x_offset_ratio: Option<f32>       # ±0.4。中央からの横ずらし (canvas 幅比、正 = 右)
  y_offset_ratio: Option<f32>       # ±0.4。縦ずらし (正 = 下)。**指定すると見出しの帯のずらしを置き換える**
  resolution: "上書き → 無ければ帯と scene.plate_tilt から決まる既定。フィールド単位で落ちる"
  clamp: "範囲外は Rust 側で丸める (UI の入力を信用しない)"
  whether:                          # rev24 (2026-09-11、mood にも面を足せるように)
    where: "**`pipeline::reference::plate_snapshot_index(scene, plate) -> Option<usize>` が唯一の決定**。None = 貼らない (素材をそのまま出す)"
    product: "人の選び直し (PlateOverride.snapshot_index) が LLM の scene.snapshot_index に勝つ (rev13)。どちらも無ければ 0 枚目"
    mood: "**人が足した時だけ**貼る。既定は絵そのまま。LLM が mood に番号を書いていても無視する (契約では null。それを根拠に貼ると誰も足していないのに面が出る)"
    no_kind_rewrite: "面を足しても `cut_kind` は書き換えない。書き換えると image_prompt が背景の記述でなくなり (ProductBackdropDrawsScreen と食い違う)、参照画像を作り直したときに mood の絵を失う"
    callers: "`reburn_caption` (焼き直し) と `plate_preview` (予定位置の枠) が**両方ここを通る**。別々に同じ式を持つと枠が嘘をつく (#19 の型)"
    material: "mood の素材は背景ではなく**絵そのもの**。空きが無い場所では絵に重なるので、大きさと位置で逃がす前提 (黙って綺麗にはならない)"
  ui: |
    rev13: スライダーとドラッグは**値を変えるだけ**。焼き直しは「適用」だけ (実測 debug 0.64 s / release 0.25 s)。
    rev14: 触っている間は**予定位置を枠で重ねる** — 座標は command `plate_preview` が
    `layout_for` + `compose::plate_quad` (合成と同じ関数) から出す。**射影の数式を TS に写さない**。
    画像は作らないので速い (ヘッダから寸法を読むだけ)。枠を画像にぴったり重ねるため、
    プレビューの要素は object-fit を使わず画像そのものの箱にする (contain だとレターボックス分ズレる)。
    rev16: 編集は結果ペインの折り畳みではなく**ダイアログ** (左が絵・右がつまみ)。絵を大きく見るため。
    rev21: **つまみは実効値を指す**。`plate_preview` が `tilt: [yaw, pitch]` (合成が使う `tilt_of` の値) を返し、
    スライダーの基準にする。`0` に置くと絵が傾いているのにつまみが 0° を指す嘘になる (failures #19)。
    表示は `plate.ts::tiltValue`/`tiltLabel` — `0° (正面)` / `18° (LLM)` / `18°` の 3 通りで**出どころまで出す**。
    開いたときに `promo.json` の `caption_overrides` / `plate_overrides` をつまみへ戻す。
    そのため `reburn_caption` は data URL だけでなく**書き換えた後の `promo`** も返す
    (上書きを書くのは backend。frontend が手元で真似ると食い違う)。
    rev18: 枠に**見出しも含む** — `plate_preview` は `caption_lines: Vec<[x,y,w,h]>` (1 行 1 枠、canvas 座標) も返す。
    出所は `image_gen::caption_layout` で、**焼き込み (`burn_caption`) がそのまま描くのと同じ結果**。
    `quad` は Option (面が無いシーンでは None — 判定は `plate_snapshot_index`、rev24)。編集中のコピー文は引数 `copy` で渡す (promo.json はまだ古い)。
    rev24: はめ込みの節は**どのシーンにも出す**。mood の既定は「はめ込みなし (絵のまま)」で、選ぶと面が乗る。
    つまみ (傾き / 大きさ / 位置) は**面がある時だけ**出す。編集ボタンはどのシーンでも押せる
    (以前は文も面も無いと押せず、mood に面を足す経路が塞がっていた)。
    フォントは数 MB〜数十 MB あるので直前の 1 つだけ持ち回す (打鍵ごとに読み直さない)。
  caption_y: "rev14: `CaptionSpec.y_ratio` / `CaptionOverride.y_ratio` (canvas 高さ比 = 文字ブロックの上端)。指定すると position + 余白より優先。canvas からはみ出す値は端で丸める"

RunSnapshots:                       # run に写したスナップショット。**run は自己完結する** (元のパスは動きうる)
  naming: "**契約**: PromoJson.snapshot_paths[i] ↔ <run>/snapshots/snapshot_{i+1:02}.*。拡張子は元のファイル次第なので読む側は前方一致"
  where: "promo_core::snapshot_prefix / snapshot_file_name が**唯一の場所**。書き出し (write_package) / 読み出し (read_run_snapshot) / 追加 (add_run_snapshot) が通る"
  why_one_place: "同じ式が 3 箇所にあると、片方だけ直したとき snapshot_index が別の画像を指す (failures #18 の型)"
  add:                              # rev19 (2026-09-09 ユーザー要望「コピーにあった画像が無いときに撮り直して貼りたい」)
    command: "add_run_snapshot(run_dir, path) → { index, snapshot_paths }。生成はやり直さない — 足した画像ははめ込みの材料になるだけ"
    numbering: "新しい番号は**一覧の長さ**で決める。ファイルを数えない (欠番や孤児があると番号がずれ、snapshot_index が別の画像を指す)"
    orphan: "同じ番号のファイルが既にあれば**拡張子を問わず先に消す**。残すと read_run_snapshot の前方一致がどちらを拾うか決まらない"
    validation: "入力ペインと同じ snapshot_meta のヘッダ検証を通す (壊れた画像を run に入れない)"
    no_dedup: "同じパスを 2 度足せる。**撮り直しは同じパスで中身が変わる**ので、パスでの重複排除は新しい画像を拒むことになる"
    intake: |
      **取り込み口は入力ペインの一覧 1 つだけ** (rev20、ユーザー判断)。ドロップ / 貼り付け / ファイル選択は
      そこに揃っているので、編集ダイアログには**取り込み口を持たせない** (持たせると同じ機能が 2 箇所になり、
      貼り付けの所有権のような調停が要る)。ダイアログは選ぶだけで、run に無いものが選ばれた時に写す。
    choices: |
      `snapshots.ts::snapshotChoices(runPaths, inputPaths, staleRunPaths)` (純関数) が一覧を組む。
      run の番号順が先、入力ペインで後から足したぶんが下。**入力ペインから外されても run のぶんは消さない**
      (run は自己完結していて、入力の一覧はこの run の履歴ではない)。
      `index: null` = まだ run に写していない → 選ばれた時に `add_run_snapshot` で写して番号を得る。
      rev23: **重複排除の鍵はパスではなく中身**。`staleRunPaths` (撮り直し) は除外しないので、
      同じパスが 2 行並ぶ — 上が run の写し (古いまま)、下が今のファイル。肩書きは「撮り直し」。
      rev20 のここが `no_dedup` に違反していた (failures #20)。
  stale:                            # rev23 (2026-09-10、撮り直しが一覧に出ない)
    command: "stale_snapshots(run_dir) → Vec<String>。run は書き換えない (数えるだけ)"
    rule: "今の元ファイルのバイト列が、**同じパスで写したどの写しとも一致しない**なら撮り直し。パスは 2 度足せるので照合は index 単位ではなく同じパスの写し全部"
    silent: "元ファイルが読めない (消された / 移された) 時と、写しが無い時は**報せない** — run は自己完結していて焼き直せる (rev10) か、別のエラーで既に報せている"
    cost: "先に長さで弾き、同じ長さの時だけ読んで照合する"
    when: "**編集ダイアログを開く直前**に数える。撮り直しはアプリの外で起きるので、監視ではなく見る直前の計測にする"
    thumbnails: "撮り直しと分かったパスは `snapshotUrls` (パスをキーにしたキャッシュ) からも捨てて読み直す。古い絵のままだと「変わっていない」と読める"

CaptionLayout:                      # rev18。見出しの版組み。**焼き込みとプレビューが共有する唯一の結果**
  why: "枠は「焼き上がりがどこに来るか」を見せるためのもの。数式が 2 つあると枠が嘘をつく (plate_quad と同じ作法)"
  where: "image_gen::caption_layout(canvas_w, canvas_h, &Caption) -> Option<CaptionLayout>。**画素を触らない** (幅送りを測るだけ)"
  px: f32                           # 自動縮小の**後**の文字の高さ。指定値をそのまま返すと枠が嘘になる
  line_h: f32                       # px * 1.3
  top: f32                          # ブロック上端 (caption_top と同じ)
  block_h: f32
  lines: "Vec<LaidOutLine { text, x, width, top }>。x は中央揃えの結果"
  fidelity: "枠は行送りの箱。**グリフの墨は枠よりわずかに内側**に入り、落ち影のぶんだけ右下にはみ出す (PoC で許容幅を固定)"

# PromoJson.original_copy (rev12): scene_id → LLM が最初に書いたコピー文。生成時に 1 度だけ入れて以後触らない。
# コピー文の書き換えは `scene.copy_text` を**その場で**書き換える — scenes.md もクリップボードも plan を
# 読むので自動で揃う。書き換えたら reburn が scenes.md も書き直す (パッケージの中で食い違わせない)。
    default_font: |
      既定 ON にすると「ON なのにフォント未選択で何も焼かれない」が無言で起きるので、実行直前に
      `pickCaptionFont` (frontend の純関数) が自動で選ぶ。規律は 4 つ:
        ①日本語グリフ必須 (copy_text は日本語)
        ②app_data/fonts に置いたもの (source=user) を最優先 — 意図して置いたものより機械の推測を上に置かない
        ③**太めのゴシックを優先**。画像に焼くので、細い明朝・教科書体は写真の上で読めない。
           優先語には**日本語表記を必ず入れる** — 実測 (Windows 11、日本語あり 118 件) で
           游ゴシック / メイリオ は日本語名で登録されており、ASCII の "yu gothic" / "meiryo" では
           一生当たらない。半角カナ (HGPｺﾞｼｯｸE) も見る
        ④同点は family 名で決める (実行のたびに変わらない)
      選べなければ**焼かずに進み**、理由を進捗に出す (画像は出す)。fontPath は空のまま保存され、
      toBackendCaption が null を返すので backend には渡らない。
    fonts: "image_gen::fonts::list_fonts(app_data/fonts) = ユーザーが置いたフォント (User) + OS のフォントフォルダ (System: Windows %WINDIR%\\Fonts と %LOCALAPPDATA%\\Microsoft\\Windows\\Fonts / macOS /System/Library/Fonts, /Library/Fonts, ~/Library/Fonts / Linux /usr/share/fonts 等)。ttf/otf/ttc。TTC は face ごとに 1 件 (index)。ファミリー名は name テーブル (日本語 0x0411 → 英語 → 任意)。has_japanese = 『あ』のグリフ有無。並び = 日本語あり → ユーザー → 名前。実測: この機体で JP 118 / 他 368 面"
    burn: "image_gen::caption::burn_caption(png, Caption{text, font_data, font_index, size_ratio 0.055, color 白, position top|bottom, margin_ratio 0.06}) — 中央揃え・複数行・落ち影 (黒 190/255、~5% ずらし)・幅 90% に収まるまで縮小 (下限 2%)。ab_glyph でラスタライズ。純粋"
    wiring: "RefJob.caption: Option<CaptionSpec{font_path, font_index, size_ratio, position}> — 生成・合成の後に scene.copy_text を焼く。フォントが読めない / 焼けない時は焼かずに続行 (画像は残す、進捗に理由)。GUI: 設定 → 画像生成 → 『見出しの焼き込み — 任意』(チェック / フォント一覧 / 高さ比 / 位置 / プレビュー / フォントフォルダを開く)。command list_fonts / open_fonts_folder / caption_preview。CLI: --caption-font 等、`promo caption` / `promo fonts`"
    poc: "caption 3 本 (空文字は同一 / 壊れフォントは Err / 実フォントで下部帯に文字・上部無傷・200 字でも端を突き抜けない) + fonts 2 本 + settings.test toBackendCaption。目視 1 枚 (BIZ UDゴシック B、demo_product_cut_caption.png)"
  http: "全て backend (reqwest)。CSP connect-src は localhost のみ。表示は data URL"
  keys: "**2 層構造を UI で明示** (rev2 査読 2): LLM = CLI 認証委任 (キー欄なし) / 画像 = OpenAI・Gemini はキー必須、ComfyUI は無キー。設定ペインは『LLM (CLI)』と『画像生成 (API キー)』を別セクションにし、『完全無キー』と読める文言を置かない"
  comfy: "HTTP ポーリング (POST /prompt → GET /history/{id} → GET /view)。WebSocket は v1 外。%prompt% %negative% %seed% %width% %height% %ref_n% の型保持置換 + 未充足 %ref_n% ノードの剪定 (Kataribe #83)"
  comfy_wait:                       # rev2 査読 7: /history 404 の期間が『実行待ち』か『失敗』か区別できない
    poll: "1s → 2s → 4s → 上限 5s の指数バックオフ"
    queue_check: "history 未着の間は GET /queue を併読し、prompt_id が queue_running / queue_pending のどちらにも無く history にも無ければ『消失』として即失敗 (timeout を待たない)。どちらかに在れば『待機中 (前に N 件)』を進捗に出す"
    timeout: "600s は『queue に居る状態』にも適用 (無限待ちはしない)"

ImageGenError:                      # (Kataribe) Unauthorized / RateLimited{detail} / Blocked{reason} / Timeout{provider} / ComfyNodeError / Api / Network / Shape / Config

ImageGenerator:                     # trait (依存性逆転)。実装 = OpenAiImages / GeminiImages / ComfyUi / テスト用 Fake
  generate: "(cfg, api_key, prompt, seed, refs) -> Result<Generated, ImageGenError>"
  probe: "(cfg, api_key) -> Result<String, ImageGenError>"

# ---------------------------------------------------------------------------
# 出力
# ---------------------------------------------------------------------------
ExportPackage:                      # export_dir/<app_name>_Promo_Package/runs/<run_id>/ (rev7)
  layout:
    - "<pkg>/runs/<run_id>/promo.json          — { project: PromoProject(パスのみ), summary: AnalyzedSummary, plan: ScenePlan }"
    - "<pkg>/runs/<run_id>/scenes.md           — シーン構成表 (Markdown 表 + 各シーンの video_prompt 全文)"
    - "<pkg>/runs/<run_id>/scene_NN_ref_MM.png — 参照画像 (**見出しを焼いた完成品**。MiniMax へ渡すのはこれ)"
    - "<pkg>/runs/<run_id>/base/scene_NN_ref_MM.png — **素材** (rev10): product は背景だけ / mood は絵そのもの。どちらも canvas 同寸の PNG"
    - "<pkg>/runs/<run_id>/snapshots/          — 入力スナップショットの写し"
  run_isolation:                    # rev7 (2026-09-08 ユーザー指摘「再起動すると出力が揮発」→ 調べたらディスク上で破壊されていた)
    why: |
      rev6 まで package_dir_name は `<app_name>_Promo_Package` だけで run の識別子を持たず、同じアプリに
      2 回実行すると promo.json / scenes.md / scene_NN_ref_MM.png が**上書きされて過去の出力が消えていた**。
      掃除もしないので、新しい run のシーン数が前回より少ないと前回の scene_07 等が残って混ざった。
      画像・動画の生成は「新しいものを過去と比べて選ぶ」作業なので、過去が消えるのは機能の否定にあたる。
    run_id: "YYYYMMDD-HHMMSS (ローカル時刻)。同一秒の衝突は `-2`, `-3` … を付す。ファイル名に使える文字だけ"
    dir: "<export_dir>/<app_name>_Promo_Package/runs/<run_id>/ — run はここで自己完結する (promo.json だけで復元できる)"
    stability: "`promo images <run_dir>/promo.json` は promo.json の親に書くので、入れ子でもそのまま動く"
    legacy: "rev6 以前の <pkg>/promo.json は移動も削除もしない (放置。索引には載らない)"
  clipboard:                        # rev3: MiniMax (画像→動画) 限定 (ユーザー決定 2026-09-08「Veo とかだと指示に従わない」)
    target: "minimax | generic"     # CopyTarget
    minimax: "motion_prompt のみ (空なら video_prompt)。画像 (scene_NN_ref_01.png) は MiniMax Design に別途アップロード"
    generic: "text-to-video の保険: video_prompt + 改行 + '[aspect 16:9 | 5s]'"
    images: "ファイルパス (クリップボードに画像バイトを載せるのは v1 外)"
  scenes_md: "先頭に『各カット = 静止画 1 枚 → image-to-video (MiniMax)』の作法。表に kind (product (snapshot N) | mood)、各シーンに Image / Motion prompt / Video prompt (fallback) / Backdrop / Copy"

AppIdentity:                        # bundle identifier。**app_data の場所と WebView プロファイルを決める**
  identifier: "jp.outcasts.apppromovideo"   # 兄弟アプリ (jp.outcasts.concordia / .fuseforks) と同じ「末尾 = 製品名」の流儀
  product_name: "AppPromoVideo"
  app_data: "%APPDATA%/<identifier>/ — .env (画像 API キー) / settings.json / runs.json / fonts/ / snapshots/"
  webview_profile: "%LOCALAPPDATA%/<identifier>/EBWebView/ — localStorage の実体"
  changing_it: |
    identifier を変えると app_data と WebView プロファイルが**別フォルダ扱いになり、既存の状態が孤児化する**。
    配布後の変更は使う人の設定・キー・履歴を黙って消すので、**公開前にしか変えられない**。
    2026-09-08 に jp.outcasts.apppromo → .apppromovideo へ変更 (public 化の直前、ユーザー判断)。移行は Roaming の
    フォルダ名変更で済ませた。WebView プロファイルは作り直させ、設定は settings.json ミラーから復元させる
    (ミラーはこの事故のために作った機構 — Kataribe 2026-08-28 実機)。
  localstorage_prefix: "apppromo. — identifier とは**別物**。今回は揃えていない (揃えると既存キーの移行が要る)"

RunIndex:                           # rev7。アプリが持つ run の索引 (app_data/runs.json)。**キャッシュであって正本ではない**
  why: "run は run_dir で自己完結するが、アプリは複数のリポジトリ・複数の出力先を横断して一覧する必要がある。走査だけでは出力先を変えた過去の run を見失う"
  authority: "正本は run_dir/promo.json。索引が指す run_dir が消えていたら missing として出し、消さない (ユーザーが動かしただけかもしれない)"
  version: u32
  runs: "Vec<RunRecord>。新しい順"

RunRecord:
  id: String                        # run_id (YYYYMMDD-HHMMSS[-N])
  created_at: i64                   # unix ms
  app_name: String                  # AnalyzedSummary.app_name (表示用)
  project_path: String              # 対象リポジトリ
  package_dir: String               # <export_dir>/<app>_Promo_Package
  run_dir: String                   # package_dir/runs/<id>
  seconds: u32
  aspect: String                    # 表示用。**契約の表記**で入れる ("16:9")。Rust の識別子 ("Landscape") ではない
  language: String                  # 同上 ("ja")
  plate_mode: String                # 同上 ("perspective")。GUI に "Perspective" と出ていたのを 2026-09-08 に修正
# PromoJson.plate_mode (rev10): run がどちらのモードで合成されたかを promo.json 自身が持つ。
# 焼き直しで合成をやり直すとき、傾きを適用するかどうかがこれで決まる (索引に頼らない)。
  scene_count: usize
  cost_usd: f64                     # analyze + plan の合計
  image_provider: Option<String>    # 参照画像を作ったなら "gemini" 等
  image_count: usize                # 生成できた枚数
  plan_attempts: usize              # rev15。PromoJson.run_stats.plan_attempts の写し。**0 = 記録なし** (rev14 以前の行)
  violation_kinds: Vec<String>      # rev15。同上。種別のみ・重複なく整列

RunStats:                           # rev15。生成時の再生成ループの記録。**正本は run_dir/promo.json**、RunRecord はその写し
  why: |
    2026-09-08 の実測で frontal の run だけ費用が約 1.5 倍 (1.422 USD 対 0.919 / 0.944) だったが、attempts も
    違反種別も永続化していなかったため「ProductBackdropAngled で再生成が発火した」という推測を確認できなかった。
    索引 (app_data/runs.json) はキャッシュで消えうるうえ、CLI (`promo run`) には索引が無いので、
    正本である promo.json 自身に持たせる (plate_mode が rev10 で同じ判断をしている)。
  plan_attempts: usize              # シーン構成が検査を通るまでの回数。1 = 一発。**analyze は常に 1 なので持たない**
  violation_kinds: "Vec<String>。promo_core::violation_kind の値を重複なく整列。**この文字列は契約**"
  cost_usd: f64                     # analyze + plan の合計。再生成が費用に効いたかを promo.json だけで見るため
  absent: "PromoJson.run_stats は Option。**None = 記録なし** であって「1 回で通った」ではない (rev14 以前の run)"
  models:                           # rev25 (2026-09-11)。実際に使われたモデル
    type: "Option<Vec<String>>。analyze + plan の**全試行**で CLI が init 行に書いたモデル名を、重複なく整列"
    resolved: "**入力した文字列ではなく解決後の名前**。`sonnet` や空欄のまま走らせても、ここには `claude-sonnet-5` のような実名が入る"
    absent: "**None = 記録なし** (rev24 以前の run)。**Some([]) = CLI が名乗らなかった** (stream-json の init を出さない CLI)。空で埋めて区別を消さない"
    why: |
      エイリアス (`sonnet`) は系列の最新版に追従するので、新しい版が出ると黙って切り替わる。
      開いている判断 1 (frontal の費用) は同じモデル同士の比較が前提なのに、それまで run はモデルを
      **どこにも残していなかった** (2026-09-11 実測: Fuseforks の promo.json に `model` の文字列 0 件)。
    assembly: "**`pipeline::stages::run_stats(&analyze, &plan)` が唯一の組み立て**。CLI (`promo run`) と GUI が同じ関数を通る (#18: 同じ構造体を 2 箇所で手組みしない)"
    index: "索引 (RunRecord) にはまだ写さない。一覧に列を足す時に写す"
  violation_kind_values: |
    scene_count / total_seconds / scene_id_not_sequential / duration_out_of_range / empty_field /
    video_prompt_not_english / video_prompt_has_aspect_flag / image_prompt_mentions_input / no_product_cut /
    snapshot_index_invalid / product_backdrop_draws_screen / motion_prompt_empty / motion_prompt_not_english /
    plate_tilt_out_of_range / product_backdrop_angled
    (PlanViolation の variant と 1:1。**describe_violation とは用途が違う** — あちらは scene_id や語が埋まる
     人と LLM 向けの文で、同じ種類でも文字列が変わるので数えられない)

