  pipeline_live_20260908: "promo run D:/Github/Kataribe (README + images/lorekeel_ui.png、--model sonnet --max-turns 12、User スコープ ANTHROPIC_API_KEY 適用、cwd = %TEMP%/apppromo_work、repo は --add-dir)。brief 12,993 字 / tree 188 行。analyze 0.390 USD / 62 s。plan **attempts 2** (初回に違反 1 件 → repair_suffix で再生成 → 通過。種別は当時の CLI が出力しておらず不明、以後は describe_violation を出す) 0.596 USD / 183 s。合計 0.99 USD / 4 分 22 秒。出力 = 7 シーン・尺合計 30 = total_seconds・video_prompt 全英語・copy 日本語・--ar なし。palette は『#15110E (ink, 焦げ茶の黒/背景)』のように hex + 説明の混在 (契約は hex 想定 — Phase C で画素算出に置き換わるので検査は緩いまま)。scene 3 の image_prompt が『upper half / lower half』の分割構図 (LLM の演出意図であり入力参照ではない。#85 の分割とは別物だが、参照画像生成時に分割が出やすい素地として記録)"
  images_live_20260908: "promo images <Kataribe の promo.json> --images gemini --image-scenes 2 --snapshot lorekeel_ui.png (GEMINI_API_KEY を User スコープから適用、モデル既定 gemini-3.1-flash-lite-image)。17 秒で 2/2 成功、各 450〜550 KB、16:9、1 場面 (分割なし)。palette from pixels = #181808 #483828 #987858 #989898 #F8F8F8 (UI スクショの暗色基調 + 白)。目視: 暖色の暗色基調はアンカーに寄った。**製品 UI そのものは 1 枚にも映らない** (7 シーン全部が情景 → scene_prompt に『UI が映るシーンを最低 1 つ』を追加)。**mood / ui_traits が日本語のまま画像モデルへ渡った** → analysis_prompt で visual_identity を英語に固定。Gemini 参照 1 枚 (max 3 のうちスナップショット 1 枚)。ComfyUI / OpenAI の live は未実施"
  auth_preflight: "claude auth status --json → { loggedIn: bool, authMethod: none|…, apiProvider } (2026-09-08 実測)。ただし OAuth の状態しか見ない (API キー経路で動く時も loggedIn=false)。runner の起動前検査には『loggedIn=false かつ ANTHROPIC_API_KEY 未設定』の組み合わせだけを『認証なし』として使う"
