config_sources:
  localStorage: "非秘密 (CliSpec / ImageGenConfig のプロバイダ別スロット (Kataribe spec 26) / 直近の project)"
  env_file: "app_data/.env — IMAGE_API_KEY_OPENAI / IMAGE_API_KEY_GEMINI (Kataribe と同名)。LLM のキーは持たない (CLI 側の認証に委ねる)"
  settings_mirror: "app_data/settings.json — localStorage の耐久コピー (Kataribe settings_store と同型。identifier 変更で設定が消える事故の予防)"

