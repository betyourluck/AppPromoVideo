[package]
name = "image_gen"
version = "0.1.0"
description = "参照画像の生成 (spec 01 Phase C)。Kataribe app/src-tauri/src/image_gen.rs の移植 + ImageGenerator trait"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
# palette の画素算出 (縮小 + 量子化)。既定 feature は重いので png / jpeg / webp だけ。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# 見出しの焼き込み (opt-in)。ab_glyph = ラスタライズ、ttf-parser = ファミリー名と日本語グリフの有無 (TTC 対応)。
ab_glyph = "0.2"
ttf-parser = "0.25"
