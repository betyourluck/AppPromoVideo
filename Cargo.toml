[workspace]
resolver = "2"
members = ["crates/promo_core", "crates/cli_runner", "crates/pipeline", "crates/image_gen"]

[workspace.package]
edition = "2024"
license = "MIT"
# data_contract meta.rust: 2024 edition は 1.85 から (構想文の 1.78 は矛盾)。
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# LLM 向け JSON Schema の機械生成 (規格 = 実装の単一真実源。Kataribe と同版系)。
schemars = "0.8"
thiserror = "2"
# image_gen: 画像プロバイダの HTTP (Kataribe と同版・同 TLS・multipart は OpenAI images/edits)。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "process", "io-util", "sync"] }
promo_core = { path = "crates/promo_core" }

# 画像処理は debug の既定 (opt-level 0) だと桁で遅い。実測 2026-09-09: 1886x1886 の再合成が
# release 252 ms に対し debug 17.9 s (71 倍)。GUI は debug ビルドを使うので体感が壊れる。
# 自分のコードのデバッグ性は保ちたいので、**画像を触る crate と依存だけ**最適化する。
[profile.dev.package.image_gen]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.ab_glyph]
opt-level = 3
[profile.dev.package.ab_glyph_rasterizer]
opt-level = 3
