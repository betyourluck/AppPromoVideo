[package]
name = "apppromo-desktop"
version = "0.1.2"
description = "AppPromoVideo — 既存アプリから動画生成用プロンプトと参照画像を出すデスクトップ殻"
edition = "2024"
rust-version = "1.85"

# 親 workspace (crates/*) に属さない独立 project として扱わせる。重い tauri 依存を
# `cargo test --workspace` のループから隔離する (Kataribe app/src-tauri と同じ流儀)。
[workspace]

[lib]
# Windows でビルド衝突を避けるため _lib サフィックス (Tauri 慣習)。
name = "apppromo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "process", "time"] }
dotenvy = "0.15"
# フォルダ / ファイル選択の OS ネイティブダイアログ。plugin を足さず custom command で完結 (追加権限ゼロ)。
rfd = "0.17"
promo_core = { path = "../../crates/promo_core" }
cli_runner = { path = "../../crates/cli_runner" }
pipeline = { path = "../../crates/pipeline" }
image_gen = { path = "../../crates/image_gen" }

# 画像処理は debug の既定 (opt-level 0) だと桁で遅い。実測 2026-09-09: 1886x1886 の再合成が
# release 252 ms に対し debug 17.9 s (71 倍)。GUI は debug ビルドを使うので体感が壊れる。
# 自分のコードのデバッグ性は保ちたいので、**画像を触る crate と依存だけ**最適化する。
[profile.dev.package.image_gen]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.ab_glyph]
opt-level = 3
[profile.dev.package.ab_glyph_rasterizer]
opt-level = 3
